name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check dist artifact
        run: |
          set -euo pipefail
          test -f dist/index.html
          if find dist -name 'player.glb' -o -name 'player_basecolor.png' -o -name 'player_orm.png' -o -name 'player_mask.png' | grep -q .; then
            echo "procedural player should not ship the old model files" >&2
            exit 1
          fi
          grep -E -q 'src="/frontyard-football/assets/[^"]+\.js"' dist/index.html
          if grep -q '/src/main.ts' dist/index.html; then
            echo "dist/index.html still references /src/main.ts" >&2
            exit 1
          fi
          echo "Pages artifact is the Vite dist build:"
          grep -E 'script|stylesheet' dist/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site (Actions source) when it does not exist yet.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
