<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frontyard Football</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<div id="view"></div>
<div id="stats" class="panel"></div>
<div id="feedback"></div>
<div id="prompt" style="display:none"></div>
<div id="padnote">🎮 Connect a controller / press any button on it &nbsp;·&nbsp; keyboard + mouse works too</div>
<div id="power"><div class="bar"><i class="tick"></i><div class="fill"></div></div><div class="lbl"><span>◀ LOFT (soft)</span><span id="powv"></span><span>BULLET (hard) ▶</span></div></div>
<div id="cam-widget">
  <button type="button" id="cam-zoom-out" title="Zoom out (−)">−</button>
  <button type="button" id="cam-style" title="Camera style (tap C)">All-22</button>
  <button type="button" id="cam-zoom-in" title="Zoom in (+)">+</button>
  <button type="button" id="cam-reset" title="Reset camera">Reset</button>
</div>
<div id="zoom-flash"></div>
<div id="floaters"></div>
<div id="toast"></div>
<button id="controls-pill" type="button">? Controls (H)</button>
<div id="help"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
